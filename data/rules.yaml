# Conservative starter set. Every entry needs human review.
known_telemetry_domains:
- id: mozilla.firefox.telemetry
  match:
    target: destination
    domain:
      exact: incoming.telemetry.mozilla.org
    process_name:
      one_of:
      - firefox
      - Firefox
      - firefox.exe
  reason: Mozilla documents this endpoint for Firefox telemetry. Connection metadata
    cannot show consent or the data sent.
  confidence: high
  platforms: all
  source_note: 'needs human review; Mozilla Firefox Enterprise Help, Domains to allow
    for Firefox, Telemetry section: https://support.mozilla.org/en-US/kb/domains-allow-firefox'
  severity: info
