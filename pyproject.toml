[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dialtone-watcher"
version = "0.1.0"
description = "Offline, advice-only machine activity inspection through MCP"
requires-python = ">=3.11"
dependencies = ["mcp", "psutil", "PyYAML"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["dialtone_watcher*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "windows_integration: real Windows snapshot (skipped on other platforms)",
    "linux_integration: real Linux collection and optional distro package-database verification",
]

[tool.setuptools.data-files]
"share/dialtone-watcher" = ["data/rules.yaml"]
